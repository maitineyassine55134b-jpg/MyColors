name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour publier une Release quand on pousse un tag vX.Y.Z

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets optionnels pour produire un APK/AAB signé (voir README)
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm ci

      - name: Copier l'app web dans le projet Android
        run: npx cap sync android

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      # ---------- APK debug (toujours) : installable directement sur un téléphone ----------
      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK debug
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MyColors-debug.apk

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: MyColors-debug-apk
          path: MyColors-debug.apk

      # ---------- APK + AAB signés (si le keystore est configuré dans les secrets) ----------
      - name: Décoder le keystore
        if: env.KS_B64 != ''
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mycolors.jks"

      - name: Build APK + AAB release signés
        if: env.KS_B64 != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mycolors.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Renommer les fichiers release
        if: env.KS_B64 != ''
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MyColors-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab MyColors-release.aab

      - name: Upload release signé
        if: env.KS_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: MyColors-release-signed
          path: |
            MyColors-release.apk
            MyColors-release.aab

      # ---------- Release GitHub (quand on pousse un tag, ex. v1.0.0) ----------
      - name: Publier la Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            MyColors-debug.apk
            MyColors-release.apk
            MyColors-release.aab
