<style>
:root{--ac:#8b7cf6;--font:system-ui,"Segoe UI",Tahoma,sans-serif}
:root[data-theme=dark]{--bg:#0f1115;--card:#171a21;--tx:#e8eaf0;--mut:#8b93a7;--bd:#262b36;color-scheme:dark}
:root[data-theme=light]{--bg:#f5f6fa;--card:#fff;--tx:#1b1e27;--mut:#636b80;--bd:#dfe3ec;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--tx);padding:0 14px 90px}
button,input,select,textarea{font:inherit;color:inherit}
nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);margin-bottom:16px;position:sticky;top:0;background:var(--bg);z-index:3}
.brand{display:flex;align-items:center;gap:8px;margin-inline-end:auto;font-weight:700;font-size:18px}
.wordmark{height:46px;width:auto}
nav a{color:var(--mut);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:14px}
nav a.on,nav a:hover{color:var(--tx);background:var(--card)}
h2{font-size:20px;margin:6px 0 12px}h3{font-size:15px;margin:0 0 8px}h4{margin:0 0 8px;font-size:14px;color:var(--mut)}
input[type=text],input[type=email],input[type=password],input[type=tel],select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;border:1px solid var(--bd);color:var(--tx)}
button.soc{background:var(--card);color:var(--tx);border:1px solid var(--bd);width:100%;padding:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:12px 0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{height:70px;border-radius:10px;border:1px solid var(--bd);display:block}
.big{height:150px;border-radius:14px;border:1px solid var(--bd);margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.mut{color:var(--mut);font-size:13px}
.wide{width:100%}
.cd{font-size:13px;margin:3px 0}
code{background:var(--bg);padding:2px 6px;border-radius:6px;direction:ltr;unicode-bidi:isolate;font-size:12px}
.hc{height:46px;border-radius:8px;margin:8px 0 4px;border:1px solid var(--bd)}
.hcodes{font-size:12px;margin-bottom:10px}
.chipf{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:5px 12px;border-radius:20px;font-size:13px}
.chipf.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sw{width:44px;height:44px;border-radius:8px;border:1px solid var(--bd);display:inline-block;position:relative}
.sw .x{position:absolute;top:-7px;inset-inline-end:-7px;width:18px;height:18px;border-radius:50%;padding:0;font-size:11px;background:#dc2626;line-height:18px}
.av{width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700}
.hide{display:none!important}
.ok{color:#16a34a;font-weight:600}.bad{color:#dc2626;font-weight:600}
.box{max-width:380px;margin:30px auto;display:flex;flex-direction:column;gap:10px;text-align:center}
.box input{text-align:start}
.logoBig{width:min(280px,72vw);height:auto;margin:0 auto}
.txt{padding:14px;border-radius:10px;margin:10px 0;font-size:18px;border:1px solid var(--bd)}
#fl{position:fixed;bottom:16px;inset-inline-end:16px;z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#flp{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;width:270px;box-shadow:0 8px 30px #0005;display:flex;flex-direction:column;gap:8px}
#flb{width:52px;height:52px;border-radius:50%;padding:0;font-size:22px;box-shadow:0 4px 14px #0004}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
[dir=rtl] #fl{align-items:flex-start;inset-inline-end:auto;inset-inline-start:16px}
.hero{background:linear-gradient(135deg,var(--ac),#22d3ee);color:#fff;border-radius:16px;padding:20px;margin-bottom:12px;box-shadow:0 6px 24px #0002}
.hero h1{margin:0 0 4px;font-size:26px}.hero p{margin:0;opacity:.92}
.tile{transition:transform .15s,box-shadow .15s}.tile:hover{transform:scale(1.06);box-shadow:0 6px 18px #0004;z-index:1}
.card{box-shadow:0 2px 12px #0001}
.chipf{transition:.15s}.chipf:hover{border-color:var(--ac)}
button{transition:filter .15s}button:hover{filter:brightness(1.08)}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
code.cp{cursor:pointer}code.cp:hover{outline:1px solid var(--ac)}
.wordmark,.logoBig{transition:transform .2s}
.wordmark:hover,.logoBig:hover{transform:scale(1.02)}
:root[data-theme=dark] .wordmark,:root[data-theme=dark] .logoBig{background:#fff;border-radius:14px;padding:6px 12px;box-sizing:content-box}
.lang{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
#main{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.colgrid.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.colgrid.list{display:flex;flex-direction:column;gap:10px}
.colcard{transition:transform .2s,box-shadow .2s}.colcard:hover{transform:translateY(-2px);box-shadow:0 8px 22px #0002}
.swrow{display:flex;flex-wrap:wrap;gap:8px}
.badge{background:var(--ac);color:#fff;border-radius:8px;min-width:30px;text-align:center;padding:5px 6px;font-size:13px}
.nameIn{flex:1;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px;font-weight:600;min-width:0}
.nameIn:hover,.nameIn:focus{border-color:var(--bd);background:var(--bg)}
.listrow{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--bd)}
.listrow .sw{width:30px;height:30px}.listrow .mut{flex:1}
input.bad{outline:2px solid #dc2626}
.dropz{border:2px dashed var(--bd);border-radius:18px;padding:28px;text-align:center;transition:.2s;background:var(--card)}
.dropz.hov{border-color:var(--ac);background:rgba(139,124,246,.1);transform:scale(1.01)}
.thumb{width:150px;padding:8px}.thumb img{width:100%;height:96px;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px}
main{max-width:1180px;margin:0 auto}
body{padding-left:clamp(12px,3vw,32px);padding-right:clamp(12px,3vw,32px)}
h2{font-size:clamp(18px,2.4vw,24px)}
nav{transition:background .2s}
nav a{display:inline-flex;align-items:center;gap:6px}
.ni{display:inline-flex}.ni svg{width:18px;height:18px;display:block}
#navLang{margin-inline-start:6px}
.tcell{display:block;text-decoration:none;color:var(--tx);min-width:0;transition:transform .15s}
.tcell:hover{transform:translateY(-2px)}
.tcell small{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.cname{font-weight:600;margin:6px 0 10px;font-size:15px}
.grid{grid-template-columns:repeat(auto-fill,minmax(clamp(96px,14vw,140px),1fr))}
.big{max-width:100%}
#expc{width:100%;max-width:560px;aspect-ratio:1;border-radius:16px;cursor:crosshair;display:block;image-rendering:pixelated;border:1px solid var(--bd)}
button{min-height:40px;touch-action:manipulation}
button:active{transform:scale(.97)}
@media (min-width:1100px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
@media (max-width:760px){
  nav{position:fixed;bottom:0;left:0;right:0;top:auto;margin:0;border:0;border-top:1px solid var(--bd);background:var(--card);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;flex-wrap:nowrap;z-index:6;box-shadow:0 -6px 20px #0002}
  nav .brand{display:none}
  nav a{flex-direction:column;gap:0;padding:6px 4px;min-width:44px;justify-content:center;border-radius:12px}
  nav a span:last-child{display:none}
  nav a .ni svg{width:22px;height:22px}
  #navLang{position:fixed;top:calc(8px + env(safe-area-inset-top));inset-inline-end:10px;margin:0;z-index:7}
  body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
  #fl{bottom:calc(88px + env(safe-area-inset-bottom))}
  #toast{bottom:160px}
  input,select,textarea{font-size:16px}
  .hero{padding:16px}.hero h1{font-size:22px}
  .grid2,.grid3{grid-template-columns:1fr}
  .box{margin-top:16px}
  .wordmark{height:40px}
}
@media (max-width:520px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .tile{height:auto;aspect-ratio:1/1}
  .row{gap:6px}
  .colgrid.grid{grid-template-columns:1fr}
}
@media (min-width:761px) and (max-width:1099px){.colgrid.grid{grid-template-columns:repeat(2,1fr)}}
.cards{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.ccard{display:block;background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--tx);transition:transform .2s,box-shadow .2s;min-width:0}
.ccard:hover{transform:translateY(-3px);box-shadow:0 10px 26px #0003}
.cswatch{height:120px;position:relative}
.fam{position:absolute;top:10px;inset-inline-start:10px;background:#000a;color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
.hexl{position:absolute;bottom:8px;inset-inline:0;text-align:center;font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:13px;text-shadow:0 1px 2px #0005}
.cbody{padding:12px 14px}
.cbody h4{color:var(--tx);font-size:16px;margin:0 0 8px;font-weight:700}
.cdl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px}
.cdl dt{color:var(--mut);font-weight:600}
.cdl dd{margin:0;font-family:ui-monospace,Menlo,monospace;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.cards{grid-template-columns:repeat(2,1fr);gap:10px}.cswatch{height:96px}.cdl{font-size:11.5px}}
@media (min-width:1100px){.cards{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ico{display:inline-block;flex-shrink:0;vertical-align:middle}
.ni{display:inline-flex;align-items:center}.ni svg{width:20px;height:20px}
nav a .ni svg{width:20px;height:20px}
button svg.ico{width:18px;height:18px}
.burger{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;min-height:38px;font-size:14px}
.burger:hover{background:var(--card)}
.menu{position:fixed;inset:0;background:#0008;z-index:12;display:flex;align-items:flex-start;justify-content:flex-end;padding:64px 12px 12px;animation:fade .2s ease}
[dir=rtl] .menu{justify-content:flex-start}
.sheet{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;width:min(380px,100%);box-shadow:0 20px 50px #0007;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.sheetHead{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menuGrid a{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--bg);color:var(--tx);text-decoration:none;border:1px solid var(--bd);transition:border-color .15s}
.menuGrid a:hover{border-color:var(--ac)}
.menuGrid .ni svg{width:22px;height:22px}
@media (max-width:760px){
  .menu{padding:0;align-items:flex-end}
  .sheet{width:100%;border-radius:20px 20px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:72vh;overflow:auto}
  .menuGrid a{flex-direction:column;text-align:center;justify-content:center;padding:16px 8px}
  .menuGrid a .ni svg{width:26px;height:26px}
  .burger{border:0;padding:6px 8px;flex-direction:column;gap:0;min-height:44px;min-width:44px;border-radius:12px}
  .burger span:last-child{display:none}
}
a.brand{text-decoration:none;color:inherit;margin-inline-end:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td,.tbl th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:start;vertical-align:middle}
.tbl th{color:var(--mut);font-weight:600}
.hide{display:none!important}
.quick{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 4px 0;border-top:1px solid var(--bd)}
.quick input{flex:1;min-width:160px}
/* default icon size: never fill the container */
svg.ico{width:20px;height:20px}
h2 svg.ico{width:.95em;height:.95em;vertical-align:-.12em;margin-inline-end:4px}
h3 svg.ico,h4 svg.ico{width:1em;height:1em;vertical-align:-.15em;margin-inline-end:2px}
.av svg.ico,.hero svg.ico{width:1.1em;height:1.1em}
.sheetHead svg.ico{width:18px;height:18px}

body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:8;pointer-events:none}

  if((m=s.match(/^rgba?\(?\s*(\d{1,3})[\s,]+(\d{1,3})[\s,]+(\d{1,3})/))){const v=[m[1],m[2],m[3]].map(Number);if(v.some(x=>x>255))return null;return rgbToHex(...v)}
  if((m=s.match(/^hsla?\(?\s*([\d.]+)(?:deg)?[\s,]+([\d.]+)%?[\s,]+([\d.]+)%?/))){const h=+m[1],se=+m[2],li=+m[3];if(se>100||li>100)return null;return hslToHex(h,se,li)}
  return null}

function LT(k){return (LIBT[P.lang]||LIBT.fr)[k]}
function menuToggle(){const m=document.getElementById('menu');if(m)m.classList.toggle('hide')}
function modinv(a,m){let r0=a,r1=m,s0=1,s1=0;while(r1){const q=Math.floor(r0/r1);[r0,r1]=[r1,r0-q*r1];[s0,s1]=[s1,s0-q*s1]}return((s0%m)+m)%m}
const LIB_N=16777216,LIB_SPACE=16777216,LIB_MUL=9973,LIB_INV=modinv(LIB_MUL,LIB_SPACE),LIB_PER=60;
let LIB={p:0};
function libColor(pos){const q=(pos*LIB_MUL)%LIB_SPACE;return rgbToHex(q>>16,(q>>8)&255,q&255)}
function libPos(hex){const[r,g,b]=hexToRgb(hex);return(((r<<16)|(g<<8)|b)*LIB_INV)%LIB_SPACE}
function vLib(){return `<h2>${ic('library')} ${LT('title')}</h2><p class="mut">${LT('hint')}</p>
  <div class="row"><input type="text" id="libQ" class="wide" placeholder="#00FFFF" onkeydown="if(event.key==='Enter')libGo()"><button onclick="libGo()">${ic('arrow')} ${LT('go')}</button><button class="g" onclick="libRnd()">${ic('random')} ${LT('rnd')}</button></div>
  <div class="row"><button class="g" onclick="libStep(-1)">${ic('left')} ${LT('prev')}</button><span id="libInfo" class="mut"></span><button class="g" onclick="libStep(1)">${LT('next')} ${ic('right')}</button></div>
  <div class="grid cards" id="libGrid"></div>`}
function libRender(){const el=$('#libGrid');if(!el)return;let h='';for(let k=0;k<LIB_PER;k++)h+=cardHtml(libColor((LIB.p+k)%LIB_N));
  el.innerHTML=h;$('#libInfo').textContent=`${LT('pos')} ${(LIB.p+1).toLocaleString(P.lang)} – ${(LIB.p+LIB_PER).toLocaleString(P.lang)} / ${LIB_N.toLocaleString(P.lang)}`}
function libStep(d){LIB.p=(LIB.p+d*LIB_PER+LIB_N)%LIB_N;libRender();scrollTo({top:0,behavior:'smooth'})}
function libGo(){const c=parseColor($('#libQ').value);if(!c){toast(t('invalid'));return}const p=libPos(c);if(p>=LIB_N){location.hash='#/c/'+c.slice(1);return}LIB.p=p;libRender()}
function libRnd(){LIB.p=Math.floor(Math.random()*LIB_N);libRender()}
let EH=200;
function drawExp(){const cv=$('#expc');if(!cv)return;const ctx=cv.getContext('2d'),img=ctx.createImageData(101,101);
  for(let y=0;y<101;y++)for(let x=0;x<101;x++){const[r,g,b]=hexToRgb(hslToHex(EH,x,100-y));const i=(y*101+x)*4;img.data[i]=r;img.data[i+1]=g;img.data[i+2]=b;img.data[i+3]=255}
  ctx.putImageData(img,0,0);$('#exHv').textContent=EH+'°'}
function syncEx(){$('#exH').value=EH;drawExp()}
function expPick(e){const cv=$('#expc'),r=cv.getBoundingClientRect();
  const x=Math.min(100,Math.max(0,Math.floor((e.clientX-r.left)/r.width*101))),y=Math.min(100,Math.max(0,Math.floor((e.clientY-r.top)/r.height*101)));
  const hex=hslToHex(EH,x,100-y);W=hex;
  $('#expInfo').innerHTML=`<div class="sw" style="background:${hex};width:72px;height:72px"></div><div><p class="cname" style="margin:0">${cname(hex)}</p>${codesHtml(hex)}<div class="row"><button onclick="location.hash='#/c/${hex.slice(1)}'">${ic('arrow')} ${t('open')}</button></div></div>`}
function vExplore(){return `<h2>${ic('explore')} ${t('ex2.t')}</h2><p class="mut">${t('ex2.hint')}</p>
  <div class="row"><button class="g" onclick="EH=(EH+359)%360;syncEx()">${ic('minus')}</button><input type="range" id="exH" class="wide" min="0" max="359" value="${EH}" oninput="EH=+this.value;drawExp()"><button class="g" onclick="EH=(EH+1)%360;syncEx()">${ic('plus')}</button><button class="g" onclick="EH=Math.floor(Math.random()*360);syncEx()">${ic('random')} ${t('rand')}</button><span id="exHv" class="mut"></span></div>
  <canvas id="expc" width="101" height="101" onclick="expPick(event)"></canvas>
  <div id="expInfo" class="row" style="margin-top:12px"></div><p class="mut">${t('ex2.more')}</p>`}
function copyText(v){try{navigator.clipboard.writeText(v).catch(()=>{})}catch(e){}toast(t('copied'))}
function togKw(k){F.kw=F.kw.includes(k)?F.kw.filter(x=>x!==k):[...F.kw,k];F.n=360;route()}

/* ---------- auth ---------- */
const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h>>>0)};
function signin(email,rec){DB.users[email]=DB.users[email]||rec;persist();me=email;sv('mc3_me',me);location.hash='#/'}
// Démo : remplacer par Google Identity Services / Sign in with Apple (jeton vérifié côté serveur)
function social(p){signin(p+'.demo@mycolors.local',{name:p==='google'?'Google (démo)':'Apple (démo)',pass:'',social:p})}
function signup(){const n=$('#aN').value.trim(),e=$('#aE').value.trim(),p=$('#aP').value;
  if(!n||!e||!p)return $('#amsg').textContent=t('req');if(DB.users[e])return $('#amsg').textContent=t('exists');signin(e,{name:n,pass:hash(p)})}
function login(){const e=$('#aE').value.trim(),p=$('#aP').value,u=DB.users[e];
  if(!u||u.pass!==hash(p))return $('#amsg').textContent=t('bad');signin(e,u)}

function sideHtml(k,label){const[h,s2,l]=rgbToHsl(...hexToRgb(WS[k]));
  return `<div class="card"><h4>${label}</h4><div class="big" id="wsw_${k}" style="height:90px;background:${WS[k]}"></div>
  <div class="row"><input type="color" id="wc_${k}" value="${WS[k]}" oninput="wSet('${k}',this.value)"><input type="text" id="wt_${k}" value="${WS[k].toUpperCase()}" oninput="wSet('${k}',this.value,1)" style="flex:1" aria-label="${label}"></div>
  ${slider(k,'h',h,360,'hue')}${slider(k,'s',s2,100,'sat')}${slider(k,'l',l,100,'light')}</div>`}
function vWcag(){return `<h2>${ic('wcag')} WCAG</h2><div class="grid2">${sideHtml('f',t('txt'))}${sideHtml('b',t('bgc'))}</div><div id="wOut"></div>`}
function wHsl(k){WS[k]=hslToHex(+$('#wk_'+k+'h').value,+$('#wk_'+k+'s').value,+$('#wk_'+k+'l').value);syncSide(k,false)}
function wSet(k,v,fromText){const c=parseColor(v);if(!c){$('#wt_'+k).classList.toggle('bad',!!fromText);return}
  WS[k]=c;syncSide(k,fromText)}
function syncSide(k,fromText){const[h,s2,l]=rgbToHsl(...hexToRgb(WS[k]));
  $('#wsw_'+k).style.background=WS[k];$('#wc_'+k).value=WS[k];if(!fromText)$('#wt_'+k).value=WS[k].toUpperCase();$('#wt_'+k).classList.remove('bad');
  $('#wk_'+k+'h').value=h;$('#wk_'+k+'s').value=s2;$('#wk_'+k+'l').value=l;
  $('#wv_'+k+'h').textContent=h;$('#wv_'+k+'s').textContent=s2;$('#wv_'+k+'l').textContent=l;updW()}
function updW(){const f=WS.f,b=WS.b,r=ratio(hexToRgb(f),hexToRgb(b));
  const lv=x=>x>=7?`<span class="ok">${t('aaa')}</span>`:x>=4.5?`<span class="ok">${t('aa')}</span>`:`<span class="bad">${t('weak')}</span>`;
  const bw=ratio([0,0,0],hexToRgb(b))>=ratio([255,255,255],hexToRgb(b))?'#000000':'#ffffff';
  const el=$('#wOut');if(!el)return;
  el.innerHTML=`<div class="txt" style="color:${f};background:${b}">${t('sample')}</div><p>${t('ratio')} : <b>${r.toFixed(2)}:1</b> · ${lv(r)}</p><p class="mut">${t('sugg')} : <code>${bw.toUpperCase()}</code></p>`}
function vProfile(){const u=U(),ini=(u.name||'?')[0].toUpperCase();
  return `<h2>${ic('prof')} ${t('profile')}</h2><div class="row">${u.photo?`<img class="av" src="${u.photo}" alt="">`:`<div class="av">${ini}</div>`}<input type="file" accept="image/*" onchange="photo(this.files[0])"></div>
  <div class="card" style="max-width:460px">
  <input type="text" id="pN" value="${u.name||''}" placeholder="${t('name')}">
  <input type="email" id="pE" value="${me}" disabled style="margin-top:8px">
  <input type="email" id="pG" value="${u.gmail||''}" placeholder="${X('gmailPh')}" style="margin-top:8px">
  <input type="tel" id="pT" value="${u.phone||''}" placeholder="${t('phone')}" style="margin-top:8px">
  <select id="pJ" class="wide" style="margin-top:8px"><option value="">${t('pickJob')}</option>${Object.keys(PROF).map(k=>`<option value="${k}" ${u.job===k?'selected':''}>${t('jobs.'+k)}</option>`).join('')}</select>
  <div class="row"><button onclick="saveP()">${ic('save')} ${t('profSave')}</button><button class="g" onclick="logout()">${ic('logout')} ${t('logout')}</button></div>
  <p class="mut">${t('profHint')}</p></div>
  <div class="card" style="max-width:460px;margin-top:14px;border-color:#dc262688"><h3>${X('delT')}</h3><p class="mut">${X('delWarnTxt')}</p>
  <button class="g" style="color:#dc2626;border-color:#dc2626" onclick="showDel()">${ic('trash')} ${X('delBtn')}</button>
  <div id="delBox" class="hide" style="margin-top:10px"><p>${X('delAsk')} <b>${X('delWord')}</b></p><div class="row"><input type="text" id="delIn" placeholder="${X('delWord')}" style="flex:1"><button onclick="deleteAccount()" style="background:#dc2626">${ic('trash')} ${X('delConfirm')}</button></div></div></div>`}
function photo(f){if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;
  const s=Math.min(img.width,img.height),x=c.getContext('2d');x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128);U().photo=c.toDataURL('image/jpeg',.85);persist();route()};img.src=r.result};r.readAsDataURL(f)}
function saveP(){const u=U(),g=$('#pG').value.trim();
  if(g&&!/@gmail\.com$/i.test(g)){toast(X('gmailBad'));return}
  u.name=$('#pN').value.trim();u.phone=$('#pT').value.trim();u.job=$('#pJ').value;u.gmail=g;persist();toast(t('profDone'));route()}
function vSettings(){const h=(i,k)=>`<h4>${ic(i)} ${t(k)}</h4>`;return `<h2>${ic('set')} ${t('settings')}</h2><div class="grid2"><div class="card">
  ${h('sun','theme')}<div class="row">${['light','dark','auto'].map(k=>`<button class="chipf ${P.theme===k?'on':''}" onclick="setP('theme','${k}')">${t(k)}</button>`).join('')}</div>
  ${h('globe','language')}<div class="row">${[['fr','Français'],['en','English'],['ar','العربية']].map(([k,n])=>`<button class="chipf ${P.lang===k?'on':''}" onclick="setP('lang','${k}')">${n}</button>`).join('')}</div>
  </div><div class="card">
  ${h('palette','accent')}<input type="color" value="${P.accent}" oninput="setP('accent',this.value,1)">
  ${h('font','font')}<div class="row">${Object.keys(FONTS).map(k=>`<button class="chipf ${P.font===k?'on':''}" style="font-family:${FONTS[k]}" onclick="setP('font','${k}')">${t('fonts.'+k)}</button>`).join('')}</div>
  <div class="row"><button class="g" onclick="P={lang:'fr',theme:'auto',accent:'#8b7cf6',font:'sys'};savePrefs();applyPrefs();route()">${ic('reset')} ${t('reset')}</button></div>
  </div></div>`}
function setP(k,v,silent){P[k]=v;savePrefs();applyPrefs();if(!silent)route()}

/* ---------- prefs ---------- */
function applyPrefs(){const root=document.documentElement;
  root.lang=P.lang;root.dir=P.lang==='ar'?'rtl':'ltr';
  const th=P.theme==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):P.theme;root.dataset.theme=th;try{const sb=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SystemBars;if(sb)sb.setStyle({style:th==='dark'?'DARK':'LIGHT'}).catch(()=>{})}catch(e){}
  root.style.setProperty('--ac',P.accent);root.style.setProperty('--font',FONTS[P.font]||FONTS.sys);
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  $('#fp').style.background=parseColor($('#fi')?.value)||'transparent';
  const nl=$('#navLang');if(nl)nl.innerHTML=langSel();
  document.querySelectorAll('[data-ic]').forEach(e=>{if(!e.innerHTML)e.innerHTML=ic(e.dataset.ic)});
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(P.theme==='auto')applyPrefs()});

/* ---------- floating quick picker ---------- */
function flIn(v){const c=parseColor(v);$('#fp').style.background=c||'transparent';$('#fc').textContent=c?c.toUpperCase():t('invalid');$('#fo').dataset.hex=c||''}
function flOpen(){const h=$('#fo').dataset.hex;if(h)location.hash='#/c/'+h.slice(1)}

/* ---------- router ---------- */
function route(){
  const h=location.hash.slice(2)||'';const[p,arg]=h.split('/');
  const mn=document.getElementById('menu');if(mn)mn.classList.add('hide');
  applyPrefs();
  if(!me||!DB.users[me]){$('#nav').classList.add('hide');$('#main').innerHTML=vAuth(p==='signup'?'signup':'login');return}
  if(p==='logout'){me=null;sv('mc3_me',null);location.hash='#/login';return route()}
  if(p==='login'||p==='signup'){location.hash='#/';return}
  $('#nav').classList.remove('hide');
  const key={'':'home',c:'home',explore:'explore',library:'explore',gradients:'grad',colorblind:'cb',extract:'ext',wcag:'wcag',saved:'saved',profile:'prof',settings:'set'}[p]||'home';
  document.querySelectorAll('nav a[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===key));
  let v;
  if(p==='c'){if(parseColor(arg))W=parseColor(arg);v=vDetail()}
  else if(p==='library')v=vLib();
  else if(p==='explore')v=vExplore();
  else if(p==='saved')v=vSaved();
  else if(p==='gradients')v=vGrad();
  else if(p==='colorblind')v=vCB();
  else if(p==='extract')v=vExt();
  else if(p==='wcag')v=vWcag();
  else if(p==='profile')v=vProfile();
  else if(p==='settings')v=vSettings();
  else v=vHome();
  $('#main').innerHTML=v;
  if(p==='wcag')updW();
  if(p===''||p===undefined||p==='')updGrid();
  if(p==='gradients')updGrad();
  if(p==='extract')exRender();
  if(p==='explore')drawExp();
  if(p==='library')libRender();
  if(p==='saved')updSaved();
  applyPrefs();
}
window.onhashchange=()=>route();
function copyEl(id){const el=document.getElementById(id);try{navigator.clipboard.writeText(el.value).catch(()=>{});}catch(e){}el.select();try{document.execCommand('copy')}catch(e){}toast(t('copied'))}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1400)}
route();
</script>
</body>
</html>
